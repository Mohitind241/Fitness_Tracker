sonar.projectKey=fitness-tracker
sonar.projectName=Fitness Tracker Application
sonar.projectVersion=1.0

# Source directories
sonar.sources=server,public

# Exclusions
sonar.exclusions=**/node_modules/**,**/*.test.js,**/coverage/**,**/*.min.js

# Language
sonar.language=js
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true
