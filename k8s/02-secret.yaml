apiVersion: v1
kind: Secret
metadata:
  name: fitness-app-secret
  namespace: fitness-app
  labels:
    app: fitness-tracker
type: Opaque
data:
  # Base64 encoded values
  # echo -n 'admin' | base64      → YWRtaW4=
  # echo -n 'Password123' | base64 → UGFzc3dvcmQxMjM=
  DB_User: YWRtaW4=
  DB_Password: UGFzc3dvcmQxMjM=
  # Add your Datadog API key (base64 encoded):
  # echo -n 'your-datadog-api-key' | base64
  DD_API_KEY: cGxhY2Vob2xkZXI=
