# ─────────────────────────────────────────────────────────────
# Kubernetes Gateway API - Fitness Tracker
# Uses NGINX Gateway Fabric (open source, works on EKS)
# ─────────────────────────────────────────────────────────────

# 1. GatewayClass — tells Kubernetes which controller handles gateways
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: nginx
spec:
  controllerName: gateway.nginx.org/nginx-gateway-controller
---
# 2. Gateway — the entry point for external traffic
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: fitness-gateway
  namespace: fitness-app
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
# 3. HTTPRoute — routing rule: all traffic → fitness-app-service
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fitness-app-route
  namespace: fitness-app
  labels:
    app: fitness-tracker
spec:
  parentRefs:
    - name: fitness-gateway
      namespace: fitness-app
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: fitness-app-service
          port: 80
