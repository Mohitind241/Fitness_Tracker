# ─── SonarCloud Configuration ───────────────────────────────────
# IMPORTANT: Replace the values below with your actual SonarCloud details
# Get these from: https://sonarcloud.io → Your Project → Information

# Your SonarCloud organization (= your GitHub username in lowercase)
sonar.organization=mohitind241

# Project key (from SonarCloud → Project → Information tab)
# Format: <organization>_<repo-name>
sonar.projectKey=Mohitind241_Fitness_Tracker

sonar.projectName=Fitness Tracker Application
sonar.projectVersion=1.0

# Source directories to analyze
sonar.sources=server,public

# Files/folders to exclude from analysis
sonar.exclusions=**/node_modules/**,**/*.test.js,**/coverage/**,**/*.min.js,**/package-lock.json

# Source encoding
sonar.sourceEncoding=UTF-8

